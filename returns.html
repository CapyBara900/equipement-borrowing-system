<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returns — Equipment Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <span class="brand">Equipment Desk</span>
  <button class="btn btn-sm btn-outline-light" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Open menu">Menu</button>
</header>

<div class="offcanvas offcanvas-start rail-canvas" tabindex="-1" id="mobileNav">
  <div class="offcanvas-body p-0"></div>
</div>

<div class="app-shell">
  <aside class="rail"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Returns</h1>
        <p>Check items back in and record what condition they came back in.</p>
      </div>
    </div>

    <div class="panel mb-4">
      <div class="panel-head"><h2>Out on loan</h2></div>
      <div class="panel-body" id="outOnLoan">Loading…</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Recently checked in</h2></div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr><th>Item</th><th>Borrower</th><th>Returned</th><th>Processed by</th><th>Remarks</th></tr>
          </thead>
          <tbody id="returnHistory"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Check-in modal -->
<div class="modal fade" id="returnModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Check in equipment</h2>
        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="returnForm" novalidate>
        <div class="modal-body">
          <p class="mb-3" id="returnItemName" style="font-weight:600"></p>
          <input type="hidden" id="returnRequestId">
          <div class="mb-3">
            <label class="form-label" for="conditionStatus">Condition</label>
            <select class="form-select" id="conditionStatus">
              <option value="good">Good — back on the shelf</option>
              <option value="damaged">Damaged</option>
              <option value="missing">Missing parts</option>
              <option value="under_repair">Needs repair</option>
            </select>
            <div class="form-text" style="font-size:.8rem" id="conditionHint">
              The item goes straight back to available.
            </div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="returnRemarks">Remarks</label>
            <textarea class="form-control" id="returnRemarks" rows="3"
                      placeholder="Anything the next borrower should know"></textarea>
            <div class="field-error" data-error-for="returnRemarks"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit" id="returnSubmit">Check in</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastZone"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=dated-cart-v2"></script>
<script src="assets/js/app.js?v=dated-cart-v2"></script>
<script src="assets/js/returns.js"></script>
</body>
</html>
