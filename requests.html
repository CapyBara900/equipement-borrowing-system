<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Borrowings — Equipment Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/styles.css?v=borrowing-management-v1" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <span class="brand">Equipment Desk</span>
  <button class="btn btn-sm btn-outline-light" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Open menu">Menu</button>
</header>

<div class="offcanvas offcanvas-start rail-canvas" tabindex="-1" id="mobileNav">
  <div class="offcanvas-body p-0"></div>
</div>

<div class="app-shell">
  <aside class="rail"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 id="pageTitle">My Borrowings</h1>
        <p id="pageSub">Loading…</p>
      </div>
    </div>

    <div id="borrowingTabs" class="borrowing-tabs panel mb-3" role="tablist" aria-label="Borrowing status" hidden>
      <button type="button" class="borrowing-tab active" id="tab-all" role="tab" aria-selected="true" aria-controls="requestList" data-status="" tabindex="0">All</button>
      <button type="button" class="borrowing-tab" id="tab-pending" role="tab" aria-selected="false" aria-controls="requestList" data-status="pending" tabindex="-1">Pending</button>
      <button type="button" class="borrowing-tab" id="tab-approved" role="tab" aria-selected="false" aria-controls="requestList" data-status="approved" tabindex="-1">Approved</button>
      <button type="button" class="borrowing-tab" id="tab-borrowed" role="tab" aria-selected="false" aria-controls="requestList" data-status="borrowed" tabindex="-1">Borrowed</button>
      <button type="button" class="borrowing-tab" id="tab-returned" role="tab" aria-selected="false" aria-controls="requestList" data-status="returned" tabindex="-1">Returned</button>
      <button type="button" class="borrowing-tab" id="tab-rejected" role="tab" aria-selected="false" aria-controls="requestList" data-status="rejected" tabindex="-1">Rejected</button>
      <button type="button" class="borrowing-tab" id="tab-cancelled" role="tab" aria-selected="false" aria-controls="requestList" data-status="cancelled" tabindex="-1">Cancelled</button>
    </div>

    <div class="panel mb-3">
      <div class="panel-body">
        <div class="row g-2">
          <div class="col-6 col-lg-4">
            <label class="form-label" for="dateFrom" id="dateFromLabel">Created from</label>
            <input class="form-control" type="date" id="dateFrom">
          </div>
          <div class="col-6 col-lg-4">
            <label class="form-label" for="dateTo" id="dateToLabel">Created to</label>
            <input class="form-control" type="date" id="dateTo">
          </div>
          <div class="col-12 col-lg-4 d-flex align-items-end">
            <button class="btn btn-outline-secondary w-100" id="clearFilters">Clear filters</button>
          </div>
        </div>
      </div>
    </div>

    <div id="borrowingFeedback" class="cart-notice mb-3" role="status" aria-live="polite" hidden></div>
    <div class="borrowing-toolbar" id="borrowingToolbar" hidden>
      <p id="borrowingCount" role="status" aria-live="polite"></p>
      <button class="btn btn-sm btn-outline-secondary" type="button" id="refreshBorrowings">Refresh</button>
    </div>
    <div id="requestList" aria-busy="true"><div class="empty">Loading…</div></div>

    <nav class="d-flex justify-content-between align-items-center mt-3" id="pager" hidden>
      <button class="btn btn-outline-secondary btn-sm" id="prevPage">Previous</button>
      <span class="borrowing-meta" id="pageLabel"></span>
      <button class="btn btn-outline-secondary btn-sm" id="nextPage">Next</button>
    </nav>
  </main>
</div>

<div class="modal fade" id="borrowingDetailsModal" tabindex="-1" aria-labelledby="borrowingDetailsTitle">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="borrowingDetailsTitle">Borrowing details</h2>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="borrowingDetailsBody"></div>
      <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Close</button></div>
    </div>
  </div>
</div>

<div class="modal fade" id="borrowingReturnModal" tabindex="-1" aria-labelledby="borrowingReturnTitle" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="borrowingReturnTitle">Mark equipment as Returned</h2>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="returnForm" novalidate>
        <div class="modal-body">
          <p class="fw-semibold" id="returnItemName"></p>
          <div id="returnError" class="cart-notice cart-error mb-3" role="alert" hidden></div>
          <div class="mb-3">
            <label class="form-label" for="conditionStatus">Condition</label>
            <select class="form-select" id="conditionStatus">
              <option value="good">Good — back on the shelf</option>
              <option value="damaged">Damaged</option>
              <option value="missing">Missing parts</option>
              <option value="under_repair">Needs repair</option>
            </select>
            <div class="form-text" id="conditionHint">The item goes straight back to available.</div>
          </div>
          <label class="form-label" for="returnRemarks">Remarks</label>
          <textarea class="form-control" id="returnRemarks" rows="3" maxlength="500" placeholder="Anything the next borrower should know"></textarea>
          <div class="field-error" data-error-for="returnRemarks"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit" id="returnSubmit">Mark as Returned</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastZone"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=borrowing-management-v1"></script>
<script src="assets/js/app.js?v=staff-navigation-v3"></script>
<script src="assets/js/requests.js?v=customer-status-v3"></script>
</body>
</html>
