<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People &amp; categories — Equipment Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <span class="brand">Equipment Desk</span>
  <button class="btn btn-sm btn-outline-light" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="Open menu">Menu</button>
</header>

<div class="offcanvas offcanvas-start rail-canvas" tabindex="-1" id="mobileNav">
  <div class="offcanvas-body p-0"></div>
</div>

<div class="app-shell">
  <aside class="rail"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>People &amp; categories</h1>
        <p>Who can use the system, and how equipment is grouped.</p>
      </div>
    </div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#peopleTab" type="button" role="tab">People</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#categoryTab" type="button" role="tab">Categories</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- People -->
      <div class="tab-pane fade show active" id="peopleTab" role="tabpanel">
        <div class="panel">
          <div class="panel-head">
            <h2>Accounts</h2>
            <button class="btn btn-primary btn-sm" id="addUserBtn">Add staff or admin</button>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
              <tbody id="userRows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Categories -->
      <div class="tab-pane fade" id="categoryTab" role="tabpanel">
        <div class="panel">
          <div class="panel-head">
            <h2>Categories</h2>
            <button class="btn btn-primary btn-sm" id="addCategoryBtn">Add category</button>
          </div>
          <div class="panel-body" id="categoryList"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- User modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Add an account</h2>
        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="userForm" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="userName">Full name</label>
            <input class="form-control" type="text" id="userName" required>
            <div class="field-error" data-error-for="userName"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="userEmail">Email</label>
            <input class="form-control" type="email" id="userEmail" required>
            <div class="field-error" data-error-for="userEmail"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="userPassword">Temporary password</label>
            <input class="form-control" type="password" id="userPassword" autocomplete="new-password" required>
            <div class="field-error" data-error-for="userPassword"></div>
            <div class="form-text" style="font-size:.8rem">At least 8 characters. Ask them to change it after signing in.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="userRole">Role</label>
            <select class="form-select" id="userRole">
              <option value="staff">Staff — processes requests and returns</option>
              <option value="admin">Administrator — full access</option>
              <option value="customer">Customer — borrows equipment</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit" id="userSubmit" disabled>Create account</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="categoryTitle">Add category</h2>
        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="categoryForm" novalidate>
        <div class="modal-body">
          <input type="hidden" id="categoryId">
          <div class="mb-3">
            <label class="form-label" for="categoryName">Name</label>
            <input class="form-control" type="text" id="categoryName" required>
            <div class="field-error" data-error-for="categoryName"></div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="categoryDescription">Description</label>
            <textarea class="form-control" id="categoryDescription" rows="2"></textarea>
            <div class="field-error" data-error-for="categoryDescription"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit" id="categorySubmit" disabled>Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toastZone"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
