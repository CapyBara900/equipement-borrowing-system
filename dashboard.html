<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — Equipment Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/styles.css?v=account-profile-v2" rel="stylesheet">
<link href="assets/css/dashboard.css?v=overview-v1" rel="stylesheet">
<link href="assets/css/sidebar.css?v=sidebar-v3" rel="stylesheet">
</head>
<body class="overview-page">

<header class="topbar">
  <span class="brand">Equipment Desk</span>
  <button class="btn btn-sm btn-outline-light" type="button"
          data-sidebar-open="#mobileNav" aria-label="Open menu">Menu</button>
</header>

<div class="rail-canvas sidebar-drawer" tabindex="-1" id="mobileNav" role="dialog" aria-modal="true" aria-label="Main navigation" hidden>
  <div class="offcanvas-body sidebar"></div>
</div>

<div class="app-shell">
  <aside class="rail sidebar" aria-label="Main navigation"></aside>

  <main class="main">
    <div class="page-head overview-page-head">
      <div>
        <span class="overview-eyebrow">YOUR WORKSPACE</span>
        <h1 id="greeting">Overview</h1>
        <p id="subhead">Loading…</p>
      </div>
      <button id="refreshDashboard" class="overview-button" type="button">↻ Refresh overview</button>
    </div>

    <p id="dashboardStatus" class="overview-feedback" role="status" aria-live="polite" aria-atomic="true">Loading overview…</p>
    <div id="dashContent" aria-busy="true">
      <div class="empty">Loading your overview…</div>
    </div>
  </main>
</div>

<dialog id="dashboardDetails" class="overview-dialog" aria-labelledby="dashboardDetailsTitle">
  <header><h2 id="dashboardDetailsTitle">Borrowing details</h2><form method="dialog"><button class="overview-dialog-close" aria-label="Close borrowing details">×</button></form></header>
  <div id="dashboardDetailsBody"></div>
</dialog>

<div id="toastZone"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=overview-v1"></script>
<script src="assets/js/sidebar.js?v=sidebar-v3"></script>
<script src="assets/js/app.js?v=sidebar-v1"></script>
<script src="assets/js/dashboard.js?v=overview-v1"></script>
</body>
</html>
